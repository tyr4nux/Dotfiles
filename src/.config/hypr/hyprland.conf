## MONITORS

monitor = eDP-1, 1920x1200@60.03, auto, 1.25
monitor = HDMI-A-1, preferred, auto, 1, mirror, eDP-1


## ENVIRONMENT VARIABLES

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Toolkit
env = CLUTTER_BACKEND,wayland
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland

# XDG
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# QT
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_STYLE_OVERRIDE,Fusion
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

# Electron
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

# Java
env = _JAVA_AWT_WM_NONREPARENTING,1
env = _JAVA_OPTIONS,-Dawt.toolkit.name=WLToolkit -Dsun.java2d.vulkan=True

# Custom tools
env = HYPRSHOT_DIR,$HOME/Pictures/Screenshots/

# Ensure environment exportation
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP QT_QPA_PLATFORMTHEME


## LOOK AND FEEL

general {
    border_size = 1
    gaps_in = 4
    gaps_out = 5
    
    col.active_border = rgba(F7DCDE39)
    col.inactive_border = rgba(A58A8D30)
    
    resize_on_border = true
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 18
    rounding_power = 2.4
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = true
    dim_strength = 0.1
    dim_special = 0.2

    shadow {
        enabled = true
        range = 50
        render_power = 4
        color = rgba(00000027)
        offset = 0 4
    }

    blur {
        enabled = true
        size = 10
        passes = 3
        new_optimizations = true
        xray = true
        noise = 0.05
        contrast = 0.89
        brightness = 1
        vibrancy = 0.5
        vibrancy_darkness = 0.5
        input_methods = true
        input_methods_ignorealpha = 0.8
    }
}

animations {
    enabled = true

    # Animation curves
    bezier = linear, 0, 0, 1, 1
    bezier = md3_standard, 0.2, 0, 0, 1
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = crazyshot, 0.1, 1.5, 0.76, 0.92 
    bezier = hyprnostretch, 0.05, 0.9, 0.1, 1.0
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.38, 0.04, 1, 0.07
    bezier = easeInOutCirc, 0.85, 0, 0.15, 1
    bezier = easeOutCirc, 0, 0.55, 0.45, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = softAcDecel, 0.26, 0.26, 0.15, 1
    bezier = md2, 0.4, 0, 0.2, 1

    # Animation configs
    animation = windows, 1, 3, md3_decel, popin 60%
    animation = windowsIn, 1, 3, md3_decel, popin 60%
    animation = windowsOut, 1, 3, md3_accel, popin 60%
    animation = border, 1, 10, default
    animation = fade, 1, 3, md3_decel
    animation = layersIn, 1, 3, menu_decel, slide
    animation = layersOut, 1, 1.6, menu_accel
    animation = fadeLayersIn, 1, 2, menu_decel
    animation = fadeLayersOut, 1, 4.5, menu_accel
    animation = workspaces, 1, 7, menu_decel, slide
    animation = workspaces, 1, 7, menu_decel, slidefade 15% # ghost slide between workspaces
    animation = specialWorkspace, 1, 3, md3_decel, slidefadevert 15%
    animation = specialWorkspace, 1, 3, md3_decel, slidevert
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = false
}

xwayland {
    force_zero_scaling = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}


## WINDOWS AND WORKSPACES

windowrule {
    # Ignore maximize requests from all apps.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

windowrule {
    # Hyprland-run windowrule
    name = move-hyprland-run
    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

windowrule = border_color rgba(FFB2BCAA) rgba(FFB2BC77), match:pin 1

## INPUT

input {
    kb_layout = us,latam
    kb_variant = altgr-intl,
    kb_options=grp:win_space_toggle

    sensitivity = 0
    accel_profile = flat
    follow_mouse = 1

    touchpad {
        natural_scroll = true
    }
}

gesture = 3, horizontal, workspace


## APP PERMISSIONS

# https://wiki.hypr.land/Configuring/Permissions/


## PROGRAMS (COMMANDS)

$browser = brave
$clipView = cliphist list | fuzzel --dmenu --with-nth 2 | cliphist decode | wl-copy
$colorPicker = hyprpicker -a -f hex
$fileManager = pcmanfm-qt
$launcher = fuzzel
$powerMenu = $HOME/.config/waybar/powerMenu.sh
$terminal = kitty


## AUTOSTART

exec-once = hypridle # power management after inactivity
exec-once = hyprlauncher -d # app launcher
exec-once = hyprpaper # wallpaper
exec-once = hyprsunset # warmer colors at night
exec-once = mako # notifications
exec-once = systemctl --user start hyprpolkitagent # allow request privileges using GUI (polkit)
exec-once = waybar
exec-once = wl-paste --type text --watch cliphist store # clipboard text logger


## KEYBINDINGS

$mainMod = SUPER

# Launchers
bind = $mainMod, B, exec, $browser
bind = $mainMod, C, exec, $clipView
bind = $mainMod, D, exec, $launcher
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, T, exec, $terminal
bind = $mainMod, ESCAPE, exec, $powerMenu
bind = $mainMod SHIFT, P, exec, $colorPicker

# Screenshots
bind = , Print, exec, hyprshot -m output -m eDP-1 -f "$(date +'%Y-%m-%d_%H-%M-%S').png"
bind = SHIFT, Print, exec, hyprshot -m region -f "$(date +'%Y-%m-%d_%H-%M-%S').png"
bind = $mainMod, Print, exec, hyprshot -m window -f "$(date +'%Y-%m-%d_%H-%M-%S').png"

# Window management
bind = $mainMod, F, fullscreen,
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, Q, killactive,
bind = $mainMod, V, togglefloating,

# Move focus with arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Send to workspaces
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll workspaces with mouse
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Resize windows with keyboard
binde = $mainMod+Ctrl, Right, resizeactive, 20 0
binde = $mainMod+Ctrl, Left, resizeactive, -20 0
binde = $mainMod+Ctrl, Up, resizeactive, 0 -20
binde = $mainMod+Ctrl, Down, resizeactive, 0 20

# Laptop volume and brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

